<!doctype html>
<!-- apps/octobrowser/src/renderer/browser.html - trusted browser chrome (tabs, toolbar, panels). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; font-src 'self'">
  <title>OctoBrowser.su</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <div id="closeveil" class="hidden" role="alertdialog" aria-modal="true" aria-labelledby="cvTitle">
    <div class="cv-box">
      <div class="cv-spin" aria-hidden="true"></div>
      <b id="cvTitle">OctoBrowser.su</b>
      <p id="cvBody"></p>
      <div class="cv-actions">
        <button id="cvForce" class="cv-force">Force close</button>
        <span id="cvWarn" class="cv-warn"></span>
      </div>
      <button id="cvKeep" class="cv-keep">Continue</button>
    </div>
  </div>
  <div id="app">
    <header id="tabstrip" role="tablist" aria-label="Tabs">
      <div id="tabs"></div>
      <button id="newTab" class="icon-btn" data-i18n-title="ui.newTab"></button>
      <div class="drag"></div>
      <div id="profileBadge" class="profile-badge" role="button" tabindex="0"></div>
    </header>
    <nav id="toolbar">
      <button id="back" class="icon-btn" data-i18n-title="ctx.back"></button>
      <button id="forward" class="icon-btn" data-i18n-title="ctx.forward"></button>
      <button id="reload" class="icon-btn" data-i18n-title="ctx.reload"></button>
      <div id="omnibox">
        <span id="secIcon" class="sec"></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="ui.addressPlaceholder" aria-label="Address">
        <span id="zoom" class="chip hidden"></span>
        <span id="blockedCount" class="chip hidden" data-i18n-title="ui.blockedOnPage"></span>
        <button id="star" class="icon-btn small" data-i18n-title="ui.bookmark"></button>
      </div>
      <div id="status" class="status-icons"></div>
    </nav>
    <div id="bookbar" class="hidden"></div>
    <div id="bars" aria-live="polite"></div>
    <div id="findbar" class="hidden">
      <input id="findInput" type="text" data-i18n-ph="ui.find" aria-label="Find">
      <span id="findCount" class="muted"></span>
      <button id="findPrev" class="icon-btn small"></button>
      <button id="findNext" class="icon-btn small"></button>
      <button id="findClose" class="icon-btn small"></button>
    </div>
    <main id="main">
      <aside id="vtabs" class="hidden"></aside>
      <section id="content" aria-label="Page"></section>
      <aside id="panel" class="hidden" aria-live="polite">
        <div class="panel-head"><h2 id="panelTitle"></h2><button id="panelClose" class="icon-btn small"></button></div>
        <div id="panelBody"></div>
      </aside>
    </main>
  </div>
  <div id="overlay" class="hidden">
    <div class="dialog" id="tabSearch">
      <input id="tabSearchInput" type="text" data-i18n-ph="ui.searchTabs">
      <div id="tabSearchList"></div>
    </div>
  </div>
  <script src="browser.js"></script>
</body>
</html>
