<!doctype html>
<!-- apps/octobrowser/src/renderer/launcher.html - profile manager / launcher of OctoBrowser.su. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>OctoBrowser.su</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <aside id="side">
    <div class="brand"><img src="../assets/logo.svg" alt="" width="34" height="34"><div><b>OctoBrowser</b><span>.su</span></div></div>
    <nav id="nav"></nav>
    <div id="sideFoot" class="muted small"></div>
  </aside>
  <main>
    <header id="top">
      <div id="secStatus" class="sec-status"></div>
      <div class="grow"></div>
      <button id="lockAll" class="btn"></button>
    </header>
    <section id="view"></section>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="launcher.js"></script>
</body>
</html>
